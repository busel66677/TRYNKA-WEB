<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081c15"><title>Тринька · Telegram</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#21523c,#0a2219 56%,#07130f);color:#f7edce;font:16px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:520px;margin:auto;padding:calc(25px + env(safe-area-inset-top)) 20px 35px}.top{display:flex;justify-content:space-between;align-items:center}.logo{color:#f5d67b;letter-spacing:3px;font-weight:900;font-size:23px}.sub{font-size:10px;color:#b5c6b9;letter-spacing:1px}.avatar{border:1px solid #bd9c57;border-radius:50%;width:44px;height:44px;background:#143f2d;color:#f4da98;font-size:20px}.hero{text-align:center;margin:58px 0 40px}.suits{font-size:53px;color:#e9c778;letter-spacing:8px;text-shadow:0 8px 28px #e7ba5266}h1{font-size:39px;margin:18px 0 6px;letter-spacing:2px}p{color:#abc2b1;margin:6px 0}.play{width:100%;background:linear-gradient(135deg,#ffe49a,#c9973c);color:#221a09;border:0;border-radius:18px;padding:20px;font-size:22px;font-weight:900;box-shadow:0 10px 30px #d5a34035}.play small{display:block;font-size:11px;margin-top:5px;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.action{background:linear-gradient(145deg,#1c4230,#10261c);border:1px solid #bca06455;color:#f9edce;border-radius:17px;padding:20px 8px;min-height:116px;font-size:15px;font-weight:750}.action b{display:block;font-size:30px;margin-bottom:8px;font-weight:400}button{cursor:pointer}button:active{transform:scale(.98)}.status{text-align:center;font-size:13px;color:#a7c6b4;margin:24px 0 0;min-height:45px}.footer{text-align:center;font-size:10px;letter-spacing:1px;color:#71917e;margin-top:25px}.panel{background:#122e22;border:1px solid #a68b5055;border-radius:18px;padding:20px;margin-top:25px}.back{background:none;border:0;color:#f2d68b;font-size:16px;padding:8px 0}input{background:#081b13;border:1px solid #587362;border-radius:10px;color:#fff;padding:13px;width:100%;font:inherit}#home[hidden],#detail[hidden]{display:none}#detail h2{margin:18px 0}#detail p{line-height:1.5}</style></head><body><main><div class="top"><div><div class="logo">♠ TRYNKA</div><div class="sub">TELEGRAM CARD CLUB</div></div><button class="avatar" id="avatar">♛</button></div><section id="home"><div class="hero"><div class="suits">♠ ♥ ♣</div><h1>Тринька</h1><p>Твоя гра. Твій стіл. Твоя перемога.</p></div><button class="play" data-page="play">▶ ГРАТИ ЗАРАЗ<small>Швидкий пошук столу</small></button><div class="grid"><button class="action" data-page="create"><b>＋</b>Створити стіл</button><button class="action" data-page="tables"><b>♠</b>Знайти стіл</button><button class="action" data-page="friends"><b>♧</b>Друзі</button><button class="action" data-page="profile"><b>♛</b>Профіль</button></div></section><section id="detail" hidden><button class="back" id="back">← Головне меню</button><div class="panel"><h2 id="heading"></h2><p id="description"></p></div></section><div class="status" id="status">Підключаємо Telegram…</div><div class="footer">TRYNKA ONLINE · УКРАЇНСЬКА КАРТКОВА ГРА</div></main><script>const tg=window.Telegram?.WebApp;const status=document.getElementById('status');let signedIn=false;try{tg?.ready();tg?.expand();}catch{};const name=tg?.initDataUnsafe?.user?.first_name||'Гравець';async function login(){if(!tg?.initData){status.textContent='Відкрий гру через кнопку в Telegram-боті';return}try{const r=await fetch('/api/telegram-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});if(!r.ok){status.textContent='Помилка входу: '+r.status;return}const session=await r.json();if(!session.access_token){status.textContent='Не вдалося створити сесію';return}signedIn=true;status.textContent='✓ Telegram підключено · '+name;}catch(e){status.textContent='Не вдалося підключитися: '+String(e.message||e).slice(0,70)}}}login();const pages={play:['Грати зараз','Пошук гравців додамо після підключення нового ігрового сервера.'],create:['Створити стіл','Створення столів зараз у розробці.'],tables:['Знайти стіл','Список онлайн-столів зараз у розробці.'],friends:['Друзі','Запрошення друзів через Telegram додамо наступним етапом.'],profile:['Профіль','Гравець: '+name]};function openPage(page){const [h,d]=pages[page];document.getElementById('heading').textContent=h;document.getElementById('description').textContent=d;document.getElementById('home').hidden=true;document.getElementById('detail').hidden=false}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('avatar').onclick=()=>openPage('profile');document.getElementById('back').onclick=()=>{document.getElementById('home').hidden=false;document.getElementById('detail').hidden=true};</script></body></html>
